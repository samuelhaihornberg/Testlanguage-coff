  header { background: var(--bg-secondary); border-bottom: 2px solid var(--accent-pink); padding: 15px 30px; display: flex; justify-content: space-between; }

  .nav-btn { background: transparent; border: 1px solid var(--accent-cyan); color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

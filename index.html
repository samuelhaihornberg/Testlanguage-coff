  body.theme-light {
    --bg-main: #f0f3f6; --bg-panel: #ffffff; --bg-card: #e1e8f0;
    --text-main: #171a21; --text-muted: #4a5568;

  body.theme-retro::after {
    content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 999; background-size: 100% 2px, 3px 100%; pointer-events: none;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; touch-action: manipulation; }
  body { background: var(--bg-main); color: var(--text-main); overflow-x: hidden; min-height: 100vh; transition: background 0.3s; }
  
  .nav-bar { background: var(--bg-panel); border-bottom: 2px solid var(--fluo-green); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px var(--border-glow); }
  .logo { font-family: 'Impact', sans-serif; font-size: 2.2rem; color: var(--text-main); letter-spacing: 2px; }
  .logo span { color: var(--fluo-green); text-shadow: 0 0 10px var(--fluo-green); }
  
  .controls-matrix { display: flex; gap: 15px; align-items: center; }
  select { background: var(--bg-card); color: var(--fluo-green); border: 1px solid var(--fluo-green); padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; outline: none; }
  
  .nav-menu { display: flex; gap: 10px; justify-content: center; background: var(--bg-card); padding: 10px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: max-content; margin: 20px auto; }
  .nav-btn { background: transparent; border: 1px solid transparent; color: var(--text-main); padding: 8px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.2s; text-transform: uppercase; }
  .nav-btn:hover { background: rgba(255,255,255,0.05); }
  .nav-btn.active { background: var(--fluo-green); color: #000; box-shadow: 0 0 10px var(--fluo-green); }
  
  .view-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
  .view { display: none; animation: fadeIn 0.2s ease; }
  .view.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .content-section { background: var(--bg-panel); border-left: 4px solid var(--jvc-orange); padding: 25px; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); margin-bottom: 30px; position: relative; }
  .content-title { color: var(--fluo-green); font-size: 1.8rem; margin-bottom: 15px; text-transform: uppercase; font-family: 'Impact', sans-serif; letter-spacing: 1px; }
  
  .feedback-panel { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; background: var(--bg-card); padding: 5px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
  .btn-feedback { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; font-weight: bold; transition: 0.2s; display: flex; align-items: center; gap: 5px; }
  .btn-feedback:hover { color: var(--text-main); }
  .btn-like.active { color: var(--fluo-green); text-shadow: 0 0 8px var(--fluo-green); }
  .btn-dislike.active { color: var(--jvc-orange); text-shadow: 0 0 8px var(--jvc-orange); }

  .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 75vh; }
  .editor-panel { display: flex; flex-direction: column; border: 1px solid var(--bg-card); border-radius: 8px; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.6); }
  .editor-header { background: var(--bg-card); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--fluo-green); }
  .editor-title { font-weight: bold; color: var(--text-main); }
  
  textarea { flex: 1; background: #0a0e14; color: var(--fluo-green); padding: 15px; font-family: 'Consolas', monospace; font-size: 0.95rem; border: none; resize: none; line-height: 1.5; }
  iframe { flex: 1; background: #000; border: none; width: 100%; }
  
  .btn-action { background: var(--fluo-green); color: #000; border: none; padding: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; font-size: 1.1rem; }
  .btn-action:hover { filter: brightness(1.2); box-shadow: 0 0 15px var(--fluo-green); }
  .btn-toggle { background: transparent; border: 1px solid var(--jvc-orange); color: var(--jvc-orange); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; transition: 0.2s; }
  .btn-toggle:hover { background: var(--jvc-orange); color: #fff; }
</style>
</head>

          const codeWithComments = `&lt;!DOCTYPE html&gt;

&lt;a1&gt; BannerClick ➡️ ActionTrigger ⚡ &lt;/a1&gt;
&lt;b2&gt; ActionTrigger ➡️➡️ VisualEngine 🎆 ➕ AudioEngine 🎵 &lt;/b2&gt;
&lt;c3&gt; BassAmplitude ↕️ ParticleVelocity 📈 &lt;/c3&gt;
&lt;d4&gt; UserSpamClick ⏩ ➡️➡️ BoostEngine ☢️ &lt;/d4&gt;

&lt;/div&gt;

&lt;script&gt;
  const canvas = document.getElementById('canvas-bg');
  const ctx = canvas.getContext('2d');
  const banner = document.getElementById('trigger-banner');
  const title = document.getElementById('title');
  let particles = [], audioCtx, clickCombo = 0, comboTimer;

  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); 
  resize();

  function acceptConsent() { 
    document.getElementById('consent-modal').style.display = 'none'; 
    audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
  }

  class Particle {
    constructor(x, y, color, isBoosted) {
      this.x = x; this.y = y; 
      const angle = Math.random() * Math.PI * 2;
      const speed = isBoosted ? Math.random() * 40 + 10 : Math.random() * 20 + 5;
      this.vx = Math.cos(angle) * speed; 
      this.vy = Math.sin(angle) * speed;
      this.size = isBoosted ? Math.random() * 20 + 8 : Math.random() * 12 + 4;
      this.color = color; this.alpha = 1; 
      this.decay = isBoosted ? Math.random() * 0.04 + 0.02 : Math.random() * 0.02 + 0.01;
    }
    update() { 
      this.x += this.vx; this.y += this.vy; 
      this.vx *= 0.92; this.vy *= 0.92; 
      this.alpha -= this.decay; 
    }
    draw() { 
      ctx.save(); 
      ctx.globalAlpha = Math.max(this.alpha, 0); 
      ctx.fillStyle = this.color; 
      ctx.shadowBlur = 20; 
      ctx.shadowColor = this.color; 
      ctx.fillRect(this.x, this.y, this.size, this.size); 
      ctx.restore(); 
    }
  }

  function triggerExplosion(x, y, isBoosted) {
    const colors = isBoosted ? ['#ffffff', '#ffcc00', '#ff0000', '#00ffcc'] : ['#ff0055', '#00e5ff', '#ffcc00'];
    const count = isBoosted ? 400 : 150;
    for (let i = 0; i < count; i++) particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)], isBoosted));
  }

  function playSound(freq, duration, type = 'square') {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type; 
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime); 
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination); 
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  }

  banner.addEventListener('pointerdown', () => {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    clickCombo++; clearTimeout(comboTimer);
    const rect = banner.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    if (clickCombo >= 4) {
      title.classList.add('overload-text'); 
      triggerExplosion(centerX, centerY, true);
      playSound(110, 0.4, 'sawtooth'); 
      playSound(880, 0.2, 'square');
    } else {
      triggerExplosion(centerX, centerY, false);
      playSound(165, 0.1); 
      setTimeout(() => playSound(330, 0.1), 80);
    }
    comboTimer = setTimeout(() => { clickCombo = 0; title.classList.remove('overload-text'); }, 400); 
  });

  function animate() {
    requestAnimationFrame(animate); 
    ctx.fillStyle = 'rgba(5, 5, 10, 0.3)'; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) { 
      particles[i].update(); 
      particles[i].draw(); 
      if (particles[i].alpha <= 0) particles.splice(i, 1); 
    }
  }
  animate();
&lt;/script&gt;

&lt;!-- Fermeture par Clé Universelle : 4x co alphanumériques = 4x &lt;/co&gt; --&gt;
&lt;/co&gt;
&lt;/co&gt;
&lt;/co&gt;
&lt;/co&gt;

&lt;/body&gt;
&lt;/html&gt;`;

              }

            // Navigation SPA
            const navBtns = document.querySelectorAll('.nav-btn');
            const views = document.querySelectorAll('.view');
            navBtns.forEach(btn => {
              btn.addEventListener('click', () => {

            // Moteur Compilation Iframe
            const runBtn = document.getElementById('run-code');

              const previewWindow = preview.contentWindow.document;

              previewWindow.close();

            // Serveur Local Storage Feedback
            const likeBtns = document.querySelectorAll('.btn-like');
            const dislikeBtns = document.querySelectorAll('.btn-dislike');

            function initFeedback(btnL, btnD) {
              const sectionId = btnL.getAttribute('data-id');
              const spanL = btnL.querySelector('span');
              const spanD = btnD.querySelector('span');
              
              let scoreL = parseInt(localStorage.getItem(`likes_${sectionId}`)) || Math.floor(Math.random() * 50) + 10;
              let scoreD = parseInt(localStorage.getItem(`dislikes_${sectionId}`)) || Math.floor(Math.random() * 5);
              let userVote = localStorage.getItem(`vote_${sectionId}`);

              spanL.innerText = scoreL; spanD.innerText = scoreD;
              if (userVote === 'like') btnL.classList.add('active');
              if (userVote === 'dislike') btnD.classList.add('active');

              const updateDB = () => {
                localStorage.setItem(`likes_${sectionId}`, scoreL);
                localStorage.setItem(`dislikes_${sectionId}`, scoreD);
                if(userVote) localStorage.setItem(`vote_${sectionId}`, userVote);
                else localStorage.removeItem(`vote_${sectionId}`);
                spanL.innerText = scoreL; spanD.innerText = scoreD;
              };

              btnL.addEventListener('click', () => {
                if (userVote === 'like') { btnL.classList.remove('active'); scoreL--; userVote = null; } 
                else {
                  btnL.classList.add('active'); scoreL++;
                  if (userVote === 'dislike') { btnD.classList.remove('active'); scoreD--; }
                  userVote = 'like';
                }
                updateDB();
              });

              btnD.addEventListener('click', () => {
                if (userVote === 'dislike') { btnD.classList.remove('active'); scoreD--; userVote = null; } 
                else {
                  btnD.classList.add('active'); scoreD++;
                  if (userVote === 'like') { btnL.classList.remove('active'); scoreL--; }
                  userVote = 'dislike';
                }
                updateDB();
              });
            }

            likeBtns.forEach((btn, index) => initFeedback(btn, dislikeBtns[index]));
          });
        </script>

        <!-- Clé de fermeture universelle : 3x co alphanumériques = 3x </co> -->
      </co>
    </co>

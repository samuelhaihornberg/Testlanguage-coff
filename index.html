<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COFF V5 - Dynamo Pulsar</title>
<style>
  body { background: #05050a; color: #ff0055; font-family: 'Impact', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; transition: background 0.1s; }
  h1 { font-size: 5rem; text-shadow: 0 0 20px #00e5ff; }
  .pulse-active { background: #1a0011; }
</style>
<body>
<div id="dynamo-ui">
<script>
<Value>
<co id="PulsarCore" type="Dynamo">

<co🔃> CoreTick ➡️ ➡️ UiPulse ⚡ </co🔃>

<script>
  const ui = document.getElementById('dynamo-ui');
  let active = false;
  
  // Boucle Dynamoactive (Le cœur bat toutes les 800ms)
  setInterval(() => {
    active = !active;
    document.body.className = active ? 'pulse-active' : '';
    ui.innerHTML = `<h1>NOYAU ACTIF : ${active ? 'ON ⚡' : 'OFF 🔄'}</h1>`;
  }, 800);
</script>

</co>
</Value>
</script>
</div>
</body>
</style>
</title>
</meta>
</meta>
</head>
</html>

<html>
<style>
<script>
<Value>
  <co id="CoffSystemRoot" type="AppModule">
    <co property="AudioEngine" param="ChiptuneSquare" value="active">
      <co property="VisualEngine" param="ParticleExplosion" value="active">
        
        <!-- === COFF V3 : Connexions explicites facilitant la lecture programme === -->
        <co> valeur:AudioMaster ↔️ valeur:CanvasRenderer </co>
        <co> valeur:TriggerBeat ➡️ valeur:ExplosionLauncher </co>
        <co> valeur:BassFrequency ↕️ valeur:ScaleAmplitude </co>
        <co> valeur:PlayerInput ⬅️ valeur:ButtonActivation </co>

        <!-- Moteur JavaScript unifié -->
        const canvas = document.createElement('canvas');
        canvas.style.cssText = 'position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; background:#05050a;';
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');

        const container = document.createElement('div');
        container.style.cssText = 'position:relative; z-index:2; text-align:center; display:flex; flex-direction:column; align-items:center; gap:20px; height:100vh; justify-content:center;';
        document.body.appendChild(container);

        const title = document.createElement('h1');
        title.innerText = 'HELLO WORLD 🚀';
        title.style.cssText = 'font-size:6rem; text-transform:uppercase; color:#ff0055; text-shadow:0 0 20px #ff0055, 0 0 40px #00ffff; font-family:Impact,sans-serif; letter-spacing:5px;';
        container.appendChild(title);

        const btn = document.createElement('button');
        btn.innerText = '⚡ ACTIVER COFF V3 AUDIO & EXPLOSIONS';
        btn.style.cssText = 'pointer-events:auto; background:linear-gradient(90deg,#ff0055,#00e5ff); border:none; color:#fff; padding:15px 30px; font-size:1.5rem; font-weight:bold; cursor:pointer; border-radius:8px; text-transform:uppercase;';
        container.appendChild(btn);

        function resize() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let particles = [];
        let audioCtx, isRunning = false;

        class Particle {
          constructor(x, y, color) {
            this.x = x; this.y = y;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 18 + 6;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.size = Math.random() * 10 + 4;
            this.color = color;
            this.alpha = 1;
            this.decay = Math.random() * 0.02 + 0.01;
          }
          update() {
            this.x += this.vx; this.y += this.vy;
            this.vx *= 0.92; this.vy *= 0.92;
            this.alpha -= this.decay;
          }
          draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(this.alpha, 0);
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 20;
            ctx.shadowColor = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.restore();
          }
        }

        function triggerExplosion() {
          const cx = window.innerWidth / 2;
          const cy = window.innerHeight / 2;
          const colors = ['#ff0055', '#00e5ff', '#ffaa00', '#ffffff'];
          for (let i = 0; i < 150; i++) {
            particles.push(new Particle(cx, cy, colors[Math.floor(Math.random() * colors.length)]));
          }
        }

        btn.onclick = () => {
          if (isRunning) return;
          isRunning = true;
          btn.style.display = 'none';

          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          let step = 0;
          setInterval(() => {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(step % 8 === 0 ? 110 : (step % 4 === 0 ? 220 : 165), audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);

            if (step % 8 === 0) triggerExplosion();
            step++;
          }, 140);
        };

        function animate() {
          requestAnimationFrame(animate);
          ctx.fillStyle = 'rgba(5, 5, 10, 0.3)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].alpha <= 0) particles.splice(i, 1);
          }
        }
        animate();

      </co>
    </co>
  </co>
</Value>
</script>
</style>
</html>

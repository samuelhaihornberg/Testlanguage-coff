<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello World - COFF V4 Logique Absolue</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #05050a; font-family: 'Impact', sans-serif; display: flex; justify-content: center; align-items: center; }
  #canvas-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; touch-action: none; }
  .container { position: relative; z-index: 2; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 30px; pointer-events: none; }
  h1 { font-size: 6rem; text-transform: uppercase; color: #ff0055; text-shadow: 0 0 20px #ff0055, 0 0 40px #00ffff, 0 0 60px #ff0055; letter-spacing: 5px; animation: glitch 1.5s infinite; transition: all 0.2s ease; }
  #trigger-banner { width: 400px; height: 80px; background: linear-gradient(to bottom, #000 33%, #fc0 33%, #fc0 66%, #000 66%); border: 4px solid #fff; box-shadow: 0 0 20px rgba(255, 204, 0, 0.6); display: flex; justify-content: center; align-items: center; cursor: pointer; pointer-events: auto; }
  #trigger-banner:active { transform: scale(0.92); box-shadow: 0 0 40px rgba(255, 0, 85, 0.9); }
  #trigger-banner span { color: #fff; font-size: 1.5rem; letter-spacing: 2px; background: rgba(0, 0, 0, 0.8); padding: 5px 15px; }
  #consent-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 10, 0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; pointer-events: auto; }
  .modal-card { background: #101424; border: 2px solid #ff0055; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 0 30px rgba(255, 0, 85, 0.5); }
  .btn-accept { background: linear-gradient(90deg, #ff0055, #00e5ff); border: none; color: #fff; padding: 12px 24px; font-size: 1.1rem; font-weight: bold; cursor: pointer; border-radius: 6px; text-transform: uppercase; }
  @keyframes glitch { 0% { text-shadow: 3px 3px 0 #0ff, -3px -3px 0 #f05; } 50% { text-shadow: -3px 3px 0 #0ff, 3px -3px 0 #f05; } 100% { text-shadow: 3px -3px 0 #0ff, -3px -3px 0 #f05; } }
  .overload-text { color: #fff !important; text-shadow: 0 0 30px #fff, 0 0 60px #fc0, 0 0 90px #f05 !important; animation: glitch 0.1s infinite !important; }
</style>
<body>

<Value>
<co id="CoffSystemRoot" type="AppModule">
<co property="AudioEngine" state="standby">
<co property="VisualEngine" symbol="🎆">
<co id="BoostEngine" type="CoreMultiplier">

<a1> BannerClick ➡️ ActionTrigger ⚡ </a1>
<b2> ActionTrigger ➡️➡️ VisualEngine 🎆 ➕ AudioEngine 🎵 </b2>
<c3> BassAmplitude ↕️ ParticleVelocity 📈 </c3>
<d4> UserSpamClick ⏩ ➡️➡️ BoostEngine ☢️ </d4>

<div id="consent-modal">
  <div class="modal-card">
    <h2>⚠️ Système COFF en attente</h2>
    <button class="btn-accept" onclick="acceptConsent()">🚀 Activer</button>
  </div>
</div>
<canvas id="canvas-bg"></canvas>
<div class="container">
  <h1 id="title">HELLO WORLD 🚀</h1>
  <div id="trigger-banner"><span>DÉCLENCHER</span></div>

<script>
  const canvas = document.getElementById('canvas-bg');
  const ctx = canvas.getContext('2d');
  const banner = document.getElementById('trigger-banner');
  const title = document.getElementById('title');
  let particles = [], audioCtx, clickCombo = 0, comboTimer;

  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); 
  resize();

  function acceptConsent() { 
    document.getElementById('consent-modal').style.display = 'none'; 
    audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
  }

  class Particle {
    constructor(x, y, color, isBoosted) {
      this.x = x; this.y = y; 
      const angle = Math.random() * Math.PI * 2;
      const speed = isBoosted ? Math.random() * 40 + 10 : Math.random() * 20 + 5;
      this.vx = Math.cos(angle) * speed; 
      this.vy = Math.sin(angle) * speed;
      this.size = isBoosted ? Math.random() * 20 + 8 : Math.random() * 12 + 4;
      this.color = color; this.alpha = 1; 
      this.decay = isBoosted ? Math.random() * 0.04 + 0.02 : Math.random() * 0.02 + 0.01;
    }
    update() { 
      this.x += this.vx; this.y += this.vy; 
      this.vx *= 0.92; this.vy *= 0.92; 
      this.alpha -= this.decay; 
    }
    draw() { 
      ctx.save(); 
      ctx.globalAlpha = Math.max(this.alpha, 0); 
      ctx.fillStyle = this.color; 
      ctx.shadowBlur = 20; 
      ctx.shadowColor = this.color; 
      ctx.fillRect(this.x, this.y, this.size, this.size); 
      ctx.restore(); 
    }
  }

  function triggerExplosion(x, y, isBoosted) {
    const colors = isBoosted ? ['#ffffff', '#ffcc00', '#ff0000', '#00ffcc'] : ['#ff0055', '#00e5ff', '#ffcc00'];
    const count = isBoosted ? 400 : 150;
    for (let i = 0; i < count; i++) particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)], isBoosted));
  }

  function playSound(freq, duration, type = 'square') {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type; 
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime); 
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination); 
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  }

  banner.addEventListener('pointerdown', () => {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    clickCombo++; clearTimeout(comboTimer);
    const rect = banner.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    if (clickCombo >= 4) {
      title.classList.add('overload-text'); 
      triggerExplosion(centerX, centerY, true);
      playSound(110, 0.4, 'sawtooth'); 
      playSound(880, 0.2, 'square');
    } else {
      triggerExplosion(centerX, centerY, false);
      playSound(165, 0.1); 
      setTimeout(() => playSound(330, 0.1), 80);
    }
    comboTimer = setTimeout(() => { clickCombo = 0; title.classList.remove('overload-text'); }, 400); 
  });

  function animate() {
    requestAnimationFrame(animate); 
    ctx.fillStyle = 'rgba(5, 5, 10, 0.3)'; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) { 
      particles[i].update(); 
      particles[i].draw(); 
      if (particles[i].alpha <= 0) particles.splice(i, 1); 
    }
  }
  animate();
</script>

</co>
</co>
</co>
</co>
</Value>

</body>
</style>
</title>
</meta>
</meta>
</head>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World - Coff V4 Autorisation & Rétro Explosif</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #05050a; font-family: 'Impact', sans-serif; display: flex; justify-content: center; align-items: center; }
    #canvas-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; touch-action: none; }
    
    .container { position: relative; z-index: 2; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px; pointer-events: none; }
    h1 {
      font-size: 5rem;
      text-transform: uppercase;
      color: #ff0055;
      text-shadow: 0 0 20px #ff0055, 0 0 40px #00ffff, 0 0 60px #ff0055;
      letter-spacing: 3px;
      animation: glitch 1.5s infinite;
    }

    /* Fenêtre modale de consentement (Cookies, Audio & Particules) */
    #consent-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 5, 10, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      pointer-events: auto;
    }
    .modal-card {
      background: #101424;
      border: 2px solid #ff0055;
      padding: 30px;
      border-radius: 12px;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .modal-card h2 { color: #00e5ff; font-size: 1.5rem; text-transform: uppercase; }
    .modal-card p { color: #aaa; font-family: sans-serif; font-size: 0.9rem; line-height: 1.4; }
    .btn-accept {
      background: linear-gradient(90deg, #ff0055, #00e5ff);
      border: none;
      color: #fff;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
      transition: transform 0.2s;
    }
    .btn-accept:hover { transform: scale(1.05); }

    @keyframes glitch {
      0% { text-shadow: 3px 3px 0px #00ffff, -3px -3px 0px #ff0055; }
      50% { text-shadow: -3px 3px 0px #00ffff, 3px -3px 0px #ff0055; }
      100% { text-shadow: 3px -3px 0px #00ffff, -3px -3px 0px #ff0055; }
    }
  </style>
</head>
<body>

  <!-- Modal d'autorisation Cookies / Audio / Particules -->
  <div id="consent-modal">
    <div class="modal-card">
      <h2>⚠️ Autorisation Requise</h2>
      <p>Cette application interactive utilise des <b>cookies de préférences</b>, un <b>synthétiseur audio rétro</b> et un <b>moteur de particules explosives</b>. Veuillez accepter pour lancer l'expérience.</p>
      <button class="btn-accept" onclick="acceptConsent()">🚀 Autoriser & Activer</button>
    </div>
  </div>

  <canvas id="canvas-bg"></canvas>
  <div class="container">
    <h1 id="title">HELLO WORLD 🚀</h1>
  </div>

<script>
<Value>
  <co id="CoffSystemRoot" type="AppModule">
    <co property="AudioEngine" param="ChiptuneSquare" value="active">
      <co property="VisualEngine" param="ParticleExplosion" value="active">
        
        <!-- === COFF V4 : Connexions explicites & routage programmatique === -->
        <co> valeur:CookieConsent ↔️ valeur:LocalStorageManager </co>
        <co> valeur:AudioMaster ↔️ valeur:CanvasRenderer </co>
        <co> valeur:TriggerBeat ➡️ valeur:ExplosionLauncher </co>
        <co> valeur:BassFrequency ↕️ valeur:ScaleAmplitude </co>

        // Moteur JavaScript unifié
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        const title = document.getElementById('title');

        function resize() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let particles = [];
        let audioCtx, isRunning = false;

        // Gestion des cookies de consentement
        function setCookie(name, value, days) {
          let expires = "";
          if (days) {
            let date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            expires = "; expires=" + date.toUTCString();
          }
          document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }

        function getCookie(name) {
          let nameEQ = name + "=";
          let ca = document.cookie.split(';');
          for(let i=0; i < ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0)==' ') c = c.substring(1,c.length);
            if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length);
          }
          return null;
        }

        // Vérification automatique au chargement si l'utilisateur a déjà donné son accord
        window.addEventListener('load', () => {
          if (getCookie("coff_consent") === "granted") {
            document.getElementById('consent-modal').style.display = 'none';
            startEngine();
          }
        });

        function acceptConsent() {
          setCookie("coff_consent", "granted", 30); // Sauvegarde du cookie pour 30 jours
          document.getElementById('consent-modal').style.display = 'none';
          startEngine();
        }

        class Particle {
          constructor(x, y, color) {
            this.x = x; this.y = y;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 18 + 6;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.size = Math.random() * 10 + 4;
            this.color = color;
            this.alpha = 1;
            this.decay = Math.random() * 0.02 + 0.01;
          }
          update() {
            this.x += this.vx; this.y += this.vy;
            this.vx *= 0.92; this.vy *= 0.92;
            this.alpha -= this.decay;
          }
          draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(this.alpha, 0);
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 20;
            ctx.shadowColor = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.restore();
          }
        }

        function triggerExplosion(x, y) {
          const colors = ['#ff0055', '#00e5ff', '#ffaa00', '#ffffff'];
          for (let i = 0; i < 120; i++) {
            particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
          }
        }

        function playChiptuneNote(freq) {
          if (!audioCtx) return;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.15);
        }

        function startEngine() {
          if (isRunning) return;
          isRunning = true;

          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }

          // Boucle rythmique automatique de fond
          let step = 0;
          setInterval(() => {
            playChiptuneNote(step % 8 === 0 ? 110 : (step % 4 === 0 ? 220 : 165));
            if (step % 8 === 0) {
              triggerExplosion(window.innerWidth / 2, window.innerHeight / 2);
            }
            step++;
          }, 140);
        }

        // Écoute des clics ou touchers tactiles sur le background pour les feux d'artifice et sons interactifs
        canvas.addEventListener('pointerdown', (e) => {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          triggerExplosion(e.clientX, e.clientY);
          playChiptuneNote(330 + Math.random() * 200);
        });

        function animate() {
          requestAnimationFrame(animate);
          ctx.fillStyle = 'rgba(5, 5, 10, 0.3)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].alpha <= 0) particles.splice(i, 1);
          }
        }
        animate();

      </co>
    </co>
  </co>
</Value>
</script>
</body>
</html>

<style>
  meta, lang, charset, viewport, theme-color, attributes, Value, co, bibliotheque { display: none !important; }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; touch-action: manipulation; }

  .view.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .article-card { background: var(--bg-panel); border-left: 4px solid var(--neon-cyan); padding: 25px; border-radius: 0 8px 8px 0; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 30px; }

  .btn-feedback { background: transparent; border: 1px solid var(--text-muted); color: var(--text-main); padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: all 0.2s; display: flex; align-items: center; gap: 5px; }
  .btn-feedback:hover { background: rgba(255,255,255,0.05); }
  .btn-like.active { border-color: var(--neon-cyan); color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,229,255,0.3); }
  .btn-dislike.active { border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: 0 0 10px rgba(255,0,85,0.3); }
</style>

<script>
  const canvas = document.getElementById('canvas-bg');
  const ctx = canvas.getContext('2d');
  const banner = document.getElementById('trigger-banner');
  const title = document.getElementById('title');
  let particles = [], audioCtx, clickCombo = 0, comboTimer;

  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); 
  resize();

  function acceptConsent() { 
    document.getElementById('consent-modal').style.display = 'none'; 
    audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
  }

  class Particle {
    constructor(x, y, color, isBoosted) {
      this.x = x; this.y = y; 
      const angle = Math.random() * Math.PI * 2;
      const speed = isBoosted ? Math.random() * 40 + 10 : Math.random() * 20 + 5;
      this.vx = Math.cos(angle) * speed; 
      this.vy = Math.sin(angle) * speed;
      this.size = isBoosted ? Math.random() * 20 + 8 : Math.random() * 12 + 4;
      this.color = color; this.alpha = 1; 
      this.decay = isBoosted ? Math.random() * 0.04 + 0.02 : Math.random() * 0.02 + 0.01;
    }
    update() { 
      this.x += this.vx; this.y += this.vy; 
      this.vx *= 0.92; this.vy *= 0.92; 
      this.alpha -= this.decay; 
    }
    draw() { 
      ctx.save(); 
      ctx.globalAlpha = Math.max(this.alpha, 0); 
      ctx.fillStyle = this.color; 
      ctx.shadowBlur = 20; 
      ctx.shadowColor = this.color; 
      ctx.fillRect(this.x, this.y, this.size, this.size); 
      ctx.restore(); 
    }
  }

  function triggerExplosion(x, y, isBoosted) {
    const colors = isBoosted ? ['#ffffff', '#ffcc00', '#ff0000', '#00ffcc'] : ['#ff0055', '#00e5ff', '#ffcc00'];
    const count = isBoosted ? 400 : 150;
    for (let i = 0; i < count; i++) particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)], isBoosted));
  }

  function playSound(freq, duration, type = 'square') {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type; 
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime); 
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination); 
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  }

  banner.addEventListener('pointerdown', () => {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    clickCombo++; clearTimeout(comboTimer);
    const rect = banner.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    if (clickCombo >= 4) {
      title.classList.add('overload-text'); 
      triggerExplosion(centerX, centerY, true);
      playSound(110, 0.4, 'sawtooth'); 
      playSound(880, 0.2, 'square');
    } else {
      triggerExplosion(centerX, centerY, false);
      playSound(165, 0.1); 
      setTimeout(() => playSound(330, 0.1), 80);
    }
    comboTimer = setTimeout(() => { clickCombo = 0; title.classList.remove('overload-text'); }, 400); 
  });

  function animate() {
    requestAnimationFrame(animate); 
    ctx.fillStyle = 'rgba(5, 5, 10, 0.3)'; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) { 
      particles[i].update(); 
      particles[i].draw(); 
      if (particles[i].alpha <= 0) particles.splice(i, 1); 
    }
  }
  animate();

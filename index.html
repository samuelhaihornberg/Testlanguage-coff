<!DOCTYPE html>

<!-- ================= 1. OUVERTURES PRINCIPALES (L'Entonnoir Spatial) ================= -->
<html lang="fr">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<body>
<style>
  :root { 
    --bg-primary: #05050a; 
    --bg-secondary: #101424; 
    --bg-card: #171b30; 
    --accent-pink: #ff0055; 
    --accent-cyan: #00e5ff; 
    --accent-yellow: #ffcc00; 
    --text-main: #f0f0f5; 
    --text-muted: #8892b0; 
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: var(--bg-primary); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
  
  header { background: var(--bg-secondary); border-bottom: 2px solid var(--accent-pink); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: 'Impact', sans-serif; font-size: 1.8rem; color: var(--accent-pink); letter-spacing: 2px; }
  .logo span { color: var(--accent-cyan); }
  nav { display: flex; gap: 10px; flex-wrap: wrap; }
  .nav-btn { background: transparent; border: 1px solid var(--text-muted); color: var(--text-main); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
  .nav-btn.active, .nav-btn:hover { background: linear-gradient(90deg, var(--accent-pink), var(--accent-cyan)); border-color: transparent; color: #fff; }
  
  main { flex: 1; padding: 30px; max-width: 1200px; width: 100%; margin: 0 auto; }
  .view-section { display: none; animation: fadeIn 0.3s; } 
  .view-section.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  
  h2 { font-family: 'Impact', sans-serif; font-size: 2.2rem; color: var(--accent-cyan); margin-bottom: 20px; text-transform: uppercase; }
  h3 { color: var(--accent-yellow); margin-bottom: 10px; font-size: 1.3rem; }
  .card { background: var(--bg-card); border: 1px solid rgba(255,0,85,0.3); border-radius: 10px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
  
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media(max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
  
  .coff-rule-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .coff-rule-table th, .coff-rule-table td { padding: 10px; border: 1px solid var(--border-color); text-align: left; }
  .coff-rule-table th { color: var(--accent-cyan); }
  .coff-tag { font-family: monospace; color: var(--accent-pink); font-weight: bold; }

  /* Interface Hub Co */
  .hubco-box { max-width: 400px; margin: 40px auto; text-align: center; }
  .coff-input { width: 100%; background: #0a0d18; border: 1px solid var(--accent-cyan); color: #fff; padding: 12px; margin-bottom: 15px; border-radius: 6px; font-family: monospace; font-size: 1rem; }
  .coff-input:focus { outline: none; border-color: var(--accent-pink); box-shadow: 0 0 10px rgba(255,0,85,0.3); }
  .coff-submit { width: 100%; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink)); border: none; color: #fff; font-weight: bold; font-size: 1.1rem; padding: 12px; border-radius: 6px; cursor: pointer; text-transform: uppercase; }
<script>


<!-- ================= 2. MÉTA, VALEURS, ATTRIBUTS & PARAM (Le Noyau de Singularité) ================= -->
<Value>
<co id="CoffHubEngine" type="PlatformCore">
<co property="UINavigation" state="active">
<co property="ForumDatabase" state="standby">
<co id="HubCo" type="ConnectionProtocol">

<!-- Routages Tertiaires COFF (Dictionnaire Alphanumérique Appliqué) -->
<coA1> NavClick ➡️ ViewSwitch 🔄 </coA1>
<coB2> PostButton ➡️➡️ DataThread 📩 </coB2>
<coC3> CompilerCheck ↕️ ValidateMirror 💎 </coC3>
<coD4> HubCoSubmit ➡️➡️ ConnectHubCo 🔗 </coD4>

<!-- Interface Graphique (UI Injectée au centre du noyau) -->
<header>
  <div class="logo">COFF <span>HUB</span></div>
  <nav>
    <button class="nav-btn active" onclick="switchView('articles', event)">Manifeste & Règles</button>
    <button class="nav-btn" onclick="switchView('results', event)">Démo PWA</button>
    <button class="nav-btn" onclick="switchView('editor', event)">Éditeur Absolu</button>
    <button class="nav-btn" onclick="switchView('forum', event)">Forum</button>
    <button class="nav-btn" style="border-color: var(--accent-yellow); color: var(--accent-yellow);" onclick="switchView('hubco-view', event)">🔗 Hub Co</button>
  </nav>
</header>

<main>
  <!-- VUE 1: ARTICLES & RÈGLES -->
  <section id="articles" class="view-section active">
    <h2>Le Manifeste COFF</h2>
    
    <div class="card">
      <h3>1. Architecture en 5 Couches (Le Miroir Absolu)</h3>
      <p>Le document abandonne le DOM classique pour un entonnoir parfait : <span class="coff-tag">html > meta > body > style > script</span>. Le cœur du système est encapsulé au point de compression maximal, avant l'inversion symétrique absolue où chaque balise se referme, même les métadonnées.</p>
    </div>

    <div class="card">
      <h3>2. Nomenclature Alphanumérique des Connecteurs</h3>
      <p style="margin-bottom: 15px;">Les balises tertiaires définissent le code génétique d'exécution spatio-temporel du COFF.</p>
      
      <div class="grid-2">
        <div>
          <h4 style="color:var(--accent-pink);">Lettres (Origine de la Valeur)</h4>
          <table class="coff-rule-table">
            <tr><th>A</th><td>Action Physique (Clic, Touch)</td></tr>
            <tr><th>B</th><td>Bridge (Pont Interne Système)</td></tr>
            <tr><th>C</th><td>Continuité (Flux Bidirectionnel)</td></tr>
            <tr><th>D</th><td>Data Hub (Protocoles Sécurisés)</td></tr>
            <tr><th>E</th><td>Environnement (État de la PWA)</td></tr>
          </table>
        </div>
        <div>
          <h4 style="color:var(--accent-cyan);">Chiffres (Attribut Temporel)</h4>
          <table class="coff-rule-table">
            <tr><th>0</th><td>Neutre / En attente</td></tr>
            <tr><th>1</th><td>Immédiat (One-shot ⚡)</td></tr>
            <tr><th>2</th><td>Profond (Pénétrant ➡️➡️)</td></tr>
            <tr><th>3</th><td>Rétroactif (Boucle ↕️/🔄)</td></tr>
            <tr><th>4</th><td>Chiffré / Sécurisé (🔗)</td></tr>
            <tr><th>5</th><td>Surcharge / Boost (⏩/☢️)</td></tr>
          </table>
        </div>
      </div>
    </div>
  </section>

  <!-- VUE 2: HUB CO -->
  <section id="hubco-view" class="view-section">
    <div class="card hubco-box">
      <h2 style="color: var(--accent-yellow);">HUB CO</h2>
      <p style="color: var(--text-muted); margin-bottom: 20px;">Accès unifié au réseau COFF.</p>
      <input type="text" class="coff-input" placeholder="Tag COFF (ex: Samintox)">
      <input type="password" class="coff-input" placeholder="Clé de Routage D4">
      <button class="coff-submit" onclick="alert('🔗 Routage <coD4> : Requête chiffrée envoyée au Hub Co.')">Ouvrir Hub Co ➡️</button>
    </div>
  </section>

  <!-- VUE 3: RÉSULTATS PWA -->
  <section id="results" class="view-section">
    <h2>Démonstration PWA</h2>
    <div class="card" style="text-align: center; padding: 50px;">
      <button style="background:var(--accent-pink); padding: 15px 30px; border:none; color:#fff; font-weight:bold; cursor:pointer;" onclick="alert('⚡ <coA1> : Déclencheur physique immédiat validé !')">TESTER LE ROUTAGE A1</button>
    </div>
  </section>

  <!-- VUE 4: ÉDITEUR -->
  <section id="editor" class="view-section">
    <h2>Bac à Sable</h2>
    <div class="card">
      <p style="color:var(--accent-cyan);">Transpileur en attente des commandes LIFO...</p>
      <textarea style="width: 100%; height: 150px; background: #0a0d18; color: #fff; border: 1px solid var(--accent-pink); margin-top: 15px; padding: 10px; font-family: monospace;">&lt;Value&gt;
&lt;co id="TestEngine"&gt;
  &lt;coB5&gt; SpamClick ⏩ ➡️➡️ Overload ☢️ &lt;/coB5&gt;
&lt;/co&gt;
&lt;/Value&gt;</textarea>
    </div>
  </section>

  <!-- VUE 5: FORUM -->
  <section id="forum" class="view-section">
    <h2>Forum Communautaire</h2>
    <div class="card">
      <h4 style="color:var(--text-main);">Implémentation du Dictionnaire Alphanumérique</h4>
      <p style="color:var(--text-muted);">Discussion ouverte : Faut-il ajouter un attribut "6" pour les bases de données externes ?</p>
    </div>
  </section>
</main>

<!-- Logique d'exécution (JavaScript Injecté) -->
function switchView(viewId, event) {
  document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(viewId).classList.add('active');
  event.currentTarget.classList.add('active');
}

<!-- Fermetures Tertiaires & Secondaires (COFF) -->
</co>
</co>
</co>
</co>
</Value>


<!-- ================= 3. FERMETURES PRINCIPALES (Le Miroir Absolu) ================= -->
</script>
</style>
</body>
</meta>
</meta>
</html>

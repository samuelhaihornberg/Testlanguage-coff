<!DOCTYPE html>
<html lang="fr">
<meta charset="UTF-8">
<style>
  /* Verrouillage d'affichage pour les balises pures COFF */
  meta, Value, co { display: none !important; }

  /* Variables par défaut (Dark Steam / Fluo Green) */
  :root { 
    --bg-main: #1b2838; 
    --bg-panel: #212933; 
    --bg-card: #2a475e;
    --text-main: #c7d5e0; 
    --text-muted: #8f98a0;
    --fluo-green: #39ff14;
    --steam-blue: #66c0f4;
    --border-glow: rgba(57, 255, 20, 0.4);
  }

  /* Theme : Light */
  body.theme-light {
    --bg-main: #f0f3f6; --bg-panel: #ffffff; --bg-card: #e1e8f0;
    --text-main: #1b2838; --text-muted: #4a5568;
    --fluo-green: #00aa00; --steam-blue: #1b2838;
    --border-glow: rgba(0, 170, 0, 0.2);
  }

  /* Theme : Retro (Scanlines CRT) */
  body.theme-retro::after {
    content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 999; background-size: 100% 2px, 3px 100%; pointer-events: none;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; touch-action: manipulation; }
  body { background: var(--bg-main); color: var(--text-main); overflow-x: hidden; min-height: 100vh; transition: background 0.3s; }
  
  /* Topbar / Command Center */
  .nav-bar { background: var(--bg-panel); border-bottom: 2px solid var(--fluo-green); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px var(--border-glow); }
  .logo { font-family: 'Impact'; font-size: 2rem; color: var(--text-main); letter-spacing: 2px; text-transform: uppercase; }
  .logo span { color: var(--fluo-green); text-shadow: 0 0 10px var(--fluo-green); }
  
  .controls-matrix { display: flex; gap: 15px; align-items: center; }
  select { background: var(--bg-card); color: var(--fluo-green); border: 1px solid var(--fluo-green); padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; outline: none; }
  
  .nav-menu { display: flex; gap: 10px; margin-top: 20px; justify-content: center; background: var(--bg-card); padding: 10px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); width: max-content; margin-left: auto; margin-right: auto; }
  .nav-btn { background: transparent; border: 1px solid transparent; color: var(--text-main); padding: 8px 16px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.2s; }
  .nav-btn:hover { background: rgba(255,255,255,0.05); }
  .nav-btn.active { background: var(--fluo-green); color: #000; box-shadow: 0 0 10px var(--fluo-green); }
  
  .view-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
  .view { display: none; animation: fadeIn 0.2s ease; }
  .view.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* Sections JVC style avec Feedback */
  .content-section { background: var(--bg-panel); border-left: 4px solid var(--steam-blue); padding: 25px; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 30px; position: relative; }
  .content-title { color: var(--fluo-green); font-size: 1.5rem; margin-bottom: 15px; text-transform: uppercase; font-family: 'Impact'; letter-spacing: 1px; }
  
  .feedback-panel { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; background: var(--bg-card); padding: 5px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
  .btn-feedback { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; font-weight: bold; transition: 0.2s; display: flex; align-items: center; gap: 5px; }
  .btn-feedback:hover { color: var(--text-main); }
  .btn-like.active { color: var(--fluo-green); text-shadow: 0 0 8px var(--fluo-green); }
  .btn-dislike.active { color: #ff3333; text-shadow: 0 0 8px #ff3333; }

  /* Éditeur SPA */
  .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 75vh; }
  .editor-panel { display: flex; flex-direction: column; border: 1px solid var(--steam-blue); border-radius: 8px; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
  .editor-header { background: var(--bg-card); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--steam-blue); }
  .editor-title { font-weight: bold; color: var(--steam-blue); }
  
  textarea { flex: 1; background: #0a0e14; color: var(--fluo-green); padding: 15px; font-family: 'Consolas', monospace; font-size: 0.9rem; border: none; resize: none; }
  iframe { flex: 1; background: #000; border: none; width: 100%; }
  
  .btn-action { background: var(--fluo-green); color: #000; border: none; padding: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
  .btn-action:hover { filter: brightness(1.2); }
  .btn-toggle { background: transparent; border: 1px solid var(--fluo-green); color: var(--fluo-green); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }

<script>
  const canvas = document.getElementById('canvas-bg');

  const banner = document.getElementById('trigger-banner');
  const title = document.getElementById('title');
  let particles = [];

  canvas.width = window.innerWidth; canvas.height = window.innerHeight;

  class Particle {
    constructor(x, y) {
      this.x = x; this.y = y; 
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 20 + 5;
      this.vx = Math.cos(angle) * speed; 
      this.vy = Math.sin(angle) * speed;
      this.size = Math.random() * 12 + 4;
      this.alpha = 1;
    }
    update() { this.x += this.vx; this.y += this.vy; this.vx *= 0.92; this.vy *= 0.92; this.alpha -= 0.02; }
    draw() { ctx.fillStyle = \`rgba(57, 255, 20, \${this.alpha})\`; ctx.fillRect(this.x, this.y, this.size, this.size); }
  }

  banner.addEventListener('pointerdown', () => {
    const rect = banner.getBoundingClientRect();
    for(let i=0; i<100; i++) particles.push(new Particle(rect.left + rect.width/2, rect.top + rect.height/2));
    title.classList.add('overload-text');
    setTimeout(() => title.classList.remove('overload-text'), 200);
  });

  function animate() {
    requestAnimationFrame(animate); 
    ctx.fillStyle = 'rgba(5, 5, 10, 0.3)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) { 
      particles[i].update(); particles[i].draw(); 
      if (particles[i].alpha <= 0) particles.splice(i, 1);

  document.addEventListener("DOMContentLoaded", () => {

    // 4. Toggle Commentaires
    const btnToggleCom = document.getElementById('btn-toggle-com');
    const editor = document.getElementById('code-editor');

    // 6. Moteur Réfractif Iframe
    const runBtn = document.getElementById('run-code');

      previewWindow.write(editor.value.replace(/<\\x2F/g, '</'));

    // 7. Mini-Serveur LocalStorage (Feedback Like/Dislike)
    const likeBtns = document.querySelectorAll('.btn-like');

      const spanL = btnL.querySelector('span');

      spanL.innerText = scoreL; spanD.innerText = scoreD;
      if (userVote === 'like') btnL.classList.add('active');
      if (userVote === 'dislike') btnD.classList.add('active');

        localStorage.setItem(`likes_${sectionId}`, scoreL);
        localStorage.setItem(`dislikes_${sectionId}`, scoreD);
        if(userVote) localStorage.setItem(`vote_${sectionId}`, userVote);
        else localStorage.removeItem(`vote_${sectionId}`);
        spanL.innerText = scoreL; spanD.innerText = scoreD;
      };

          btnL.classList.add('active'); scoreL++;
          if (userVote === 'dislike') { btnD.classList.remove('active'); scoreD--; }

          if (userVote === 'like') { btnL.classList.remove('active'); scoreL--; }
          userVote = 'dislike';
        }
        updateDB();
      });
    }

    likeBtns.forEach((btn, index) => initFeedback(btn, dislikeBtns[index]));
